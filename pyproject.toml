[project]
name = "dxf2qet"
version = "0.1.0"
description = "Konvertiert DXF-Zeichnungen in QElectroTech-Elemente (.elmt) und -Projekte (.qet)"
requires-python = ">=3.12"
dependencies = [
    "ezdxf>=1.3",
    "PySide6>=6.7",
]

[project.scripts]
dxf2qet = "dxf2qet.__main__:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
